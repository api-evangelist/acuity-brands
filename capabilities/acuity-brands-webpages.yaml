naftiko: 1.0.0-alpha2
info:
  label: Acuity Brands API — Webpages
  description: 'Acuity Brands API — Webpages. 2 operations. Lead operation: Acuity Brands List Webpages. Self-contained Naftiko
    capability covering one Acuity Brands business surface.'
  tags:
  - Acuity Brands
  - Webpages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACUITY_BRANDS_API_KEY: ACUITY_BRANDS_API_KEY
capability:
  consumes:
  - type: http
    namespace: acuity-brands-webpages
    baseUri: https://api.acuitybrands.com/v1
    description: Acuity Brands API — Webpages business capability. Self-contained, no shared references.
    resources:
    - name: webpages
      path: /webpages
      operations:
      - name: listwebpages
        method: GET
        description: Acuity Brands List Webpages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Page type filter (product, category, landing)
        - name: brand
          in: query
          type: string
          description: Filter by brand
        - name: limit
          in: query
          type: integer
          description: Maximum number of results
        - name: cursor
          in: query
          type: string
          description: Pagination cursor
    - name: webpages-pageId
      path: /webpages/{pageId}
      operations:
      - name: getwebpage
        method: GET
        description: Acuity Brands Get Webpage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageId
          in: path
          type: string
          description: Page identifier
          required: true
    authentication:
      type: basic
      username: '{{env.ACUITY_BRANDS_USER}}'
      password: '{{env.ACUITY_BRANDS_PASS}}'
  exposes:
  - type: rest
    namespace: acuity-brands-webpages-rest
    port: 8080
    description: REST adapter for Acuity Brands API — Webpages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/webpages
      name: webpages
      description: REST surface for webpages.
      operations:
      - method: GET
        name: listwebpages
        description: Acuity Brands List Webpages
        call: acuity-brands-webpages.listwebpages
        with:
          type: rest.type
          brand: rest.brand
          limit: rest.limit
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webpages/{pageid}
      name: webpages-pageid
      description: REST surface for webpages-pageId.
      operations:
      - method: GET
        name: getwebpage
        description: Acuity Brands Get Webpage
        call: acuity-brands-webpages.getwebpage
        with:
          pageId: rest.pageId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: acuity-brands-webpages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Acuity Brands API — Webpages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: acuity-brands-list-webpages
      description: Acuity Brands List Webpages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: acuity-brands-webpages.listwebpages
      with:
        type: tools.type
        brand: tools.brand
        limit: tools.limit
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: acuity-brands-get-webpage
      description: Acuity Brands Get Webpage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: acuity-brands-webpages.getwebpage
      with:
        pageId: tools.pageId
      outputParameters:
      - type: object
        mapping: $.
