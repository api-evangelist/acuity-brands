naftiko: "1.0.0-alpha1"

info:
  label: "Acuity Brands API"
  description: "B2B REST APIs for inventory availability, order status tracking, product catalog, and web content for Acuity Brands distributors."
  tags:
    - Acuity Brands
    - Lighting
    - B2B
    - Inventory
    - Order Management
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      ACUITY_BRANDS_USER_ID: ACUITY_BRANDS_USER_ID
      ACUITY_BRANDS_API_KEY: ACUITY_BRANDS_API_KEY

capability:
  consumes:
    - type: http
      namespace: acuity-brands
      baseUri: "https://api.acuitybrands.com/v1"
      description: "Acuity Brands production API"
      authentication:
        type: basic
        username: "{{ACUITY_BRANDS_USER_ID}}"
        password: "{{ACUITY_BRANDS_API_KEY}}"
      resources:
        - name: inventory
          path: /inventory
          description: "Product inventory and availability"
          operations:
            - name: list-inventory
              method: GET
              description: "List inventory availability"
              inputParameters:
                - name: productNumber
                  in: query
                  type: string
                  required: false
                  description: "Product number filter"
                - name: brand
                  in: query
                  type: string
                  required: false
                  description: "Brand filter"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Page size"
                - name: cursor
                  in: query
                  type: string
                  required: false
                  description: "Pagination cursor"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-inventory-item
              method: GET
              description: "Get inventory for a specific product"
              inputParameters:
                - name: productNumber
                  in: path
                  type: string
                  required: true
                  description: "Product number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: orders
          path: /orders
          description: "Order status and tracking"
          operations:
            - name: list-orders
              method: GET
              description: "List orders with status"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Status filter"
                - name: fromDate
                  in: query
                  type: string
                  required: false
                  description: "From date filter"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Page size"
                - name: cursor
                  in: query
                  type: string
                  required: false
                  description: "Pagination cursor"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-order
              method: GET
              description: "Get a specific order"
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
                  description: "Order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-order-shipments
              method: GET
              description: "Get shipment records for an order"
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
                  description: "Order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: catalog
          path: /catalog/items
          description: "Product catalog"
          operations:
            - name: list-catalog-items
              method: GET
              description: "Search the product catalog"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: false
                  description: "Keyword search"
                - name: brand
                  in: query
                  type: string
                  required: false
                  description: "Brand filter"
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Category filter"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Page size"
                - name: cursor
                  in: query
                  type: string
                  required: false
                  description: "Pagination cursor"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-catalog-item
              method: GET
              description: "Get a specific product"
              inputParameters:
                - name: productNumber
                  in: path
                  type: string
                  required: true
                  description: "Product number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: acuity-brands-rest
      resources:
        - path: /v1/inventory
          name: inventory
          description: "Inventory availability"
          operations:
            - method: GET
              name: list-inventory
              description: "List inventory"
              call: "acuity-brands.list-inventory"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/orders
          name: orders
          description: "Order status"
          operations:
            - method: GET
              name: list-orders
              description: "List orders"
              call: "acuity-brands.list-orders"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: acuity-brands-mcp
      transport: http
      tools:
        - name: list-inventory
          description: "List inventory availability for Acuity Brands products"
          hints:
            readOnly: true
            openWorld: true
          call: "acuity-brands.list-inventory"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-inventory-item
          description: "Get inventory availability for a specific product"
          hints:
            readOnly: true
            openWorld: false
          call: "acuity-brands.get-inventory-item"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-orders
          description: "List orders with status and shipment information"
          hints:
            readOnly: true
            openWorld: true
          call: "acuity-brands.list-orders"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-order
          description: "Get full order details including line items and ship dates"
          hints:
            readOnly: true
            openWorld: false
          call: "acuity-brands.get-order"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-order-shipments
          description: "Get shipment records for an order including carrier and pro number"
          hints:
            readOnly: true
            openWorld: false
          call: "acuity-brands.get-order-shipments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-catalog-items
          description: "Search the Acuity Brands product catalog by keyword, brand, or category"
          hints:
            readOnly: true
            openWorld: true
          call: "acuity-brands.list-catalog-items"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-catalog-item
          description: "Get detailed product information including specs and certifications"
          hints:
            readOnly: true
            openWorld: false
          call: "acuity-brands.get-catalog-item"
          outputParameters:
            - type: object
              mapping: "$."
