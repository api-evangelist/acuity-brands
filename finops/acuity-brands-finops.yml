meters:
  - name: api_request
    description: API request consumed against the distributor's allocation; not directly billed.
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - distributor
  - name: product_order
    description: B2B order placed through Acuity's order-entry surface (the underlying business transaction
      that the API supports).
    unit: order
    aggregation: sum
    dimensions:
      - distributor
      - product_family
principles:
  - name: Visibility
    description: There is no Acuity API invoice. Visibility is internal to the distributor — track which
      ERP / e-commerce systems hit the API and at what frequency.
  - name: Allocation
    description: Allocate integration cost (distributor-side compute and engineering) to the function
      it supports — order entry, catalog refresh, inventory checks.
  - name: Optimization
    description: Cache catalog and inventory responses where appropriate, batch order-status polls, and
      avoid duplicate calls across multiple internal systems.
  - name: Accountability
    description: The distributor's IT integration owner is accountable; Acuity Brands acts as a partner
      contact for limit increases.
