description: FOCUS-aligned FinOps scaffold for the Acuity Brands distributor API. Acuity Brands invoices
  distributors for product (hardware) — not for API access. The API is bundled into the partner relationship,
  so FinOps relevance is to the consuming distributor's integration economics, not a separately-billed
  Acuity surface.
sources:
  - https://api-docs.acuitybrands.com/
notes: No commercial API line item. Reconciled flag is false because there is no provider invoice that
  separates API from product spend.
